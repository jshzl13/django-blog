<VirtualHost *:80>
    ServerName localhost

    # Direct access to static and media files
    Alias /static/ /app/staticfiles/
    <Directory /app/staticfiles>
        Require all granted
    </Directory>

    Alias /media/ /app/media/
    <Directory /app/media>
        Require all granted
    </Directory>

    # mod_wsgi Configuration (Daemon Mode)
    WSGIDaemonProcess myproject python-home=/opt/venv python-path=/app
    WSGIProcessGroup myproject
    WSGIScriptAlias / /app/myproject/wsgi.py

    <Directory /app/myproject>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>