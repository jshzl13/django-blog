<VirtualHost *:80>
    ServerName localhost

    # Direct access to static and media files
    Alias /static/ /app/staticfiles/
    <Directory /app/staticfiles>
        Require all granted
    </Directory>

    ProxyPass /static/ !
    ProxyPass / http://web:8080/
    ProxyPassReverse / http://web:8080/

    Alias /media/ /app/media/
    <Directory /app/media>
        Require all granted
    </Directory>

    # mod_wsgi Configuration (Daemon Mode)
    WSGIDaemonProcess core python-home=/opt/venv python-path=/app
    WSGIProcessGroup core
    WSGIScriptAlias / /app/core/wsgi.py

    <Directory /app/core>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>